<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560">

  <defs>

    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1029"/>
      <stop offset="45%" stop-color="#30105f"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="50%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="keyboard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#17172e"/>
      <stop offset="100%" stop-color="#080812"/>
    </linearGradient>

    <linearGradient id="mug" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadow">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-opacity=".45"/>
    </filter>

  </defs>


  <!-- Laptop -->

  <g filter="url(#shadow)">

    <!-- Screen outer -->
    <rect
      x="145"
      y="65"
      width="470"
      height="295"
      rx="18"
      fill="#080812"
      stroke="#a855f7"
      stroke-width="4"
    />

    <!-- Screen -->
    <rect
      x="162"
      y="82"
      width="436"
      height="258"
      rx="8"
      fill="url(#screen)"
    />

    <!-- Code lines -->
    <g opacity=".9">

      <rect x="195" y="120" width="130" height="8" rx="4" fill="#c084fc"/>
      <rect x="195" y="145" width="210" height="7" rx="3" fill="#818cf8"/>
      <rect x="215" y="170" width="150" height="7" rx="3" fill="#f0abfc"/>
      <rect x="215" y="195" width="230" height="7" rx="3" fill="#8b5cf6"/>
      <rect x="195" y="220" width="180" height="7" rx="3" fill="#22d3ee"/>
      <rect x="215" y="245" width="250" height="7" rx="3" fill="#c084fc"/>
      <rect x="215" y="270" width="120" height="7" rx="3" fill="#818cf8"/>

    </g>


    <!-- Laptop base -->
    <path
      d="M105 360 L650 360 L730 455 Q735 470 715 475 L80 475 Q60 470 65 455 Z"
      fill="url(#body)"
      stroke="#c084fc"
      stroke-width="3"
    />


    <!-- Keyboard area -->
    <path
      d="M185 380 L585 380 L630 435 L135 435 Z"
      fill="url(#keyboard)"
    />


    <!-- Keyboard keys -->
    <g fill="#312e81" stroke="#8b5cf6" stroke-width="1">

      <rect x="190" y="392" width="34" height="12" rx="3"/>
      <rect x="232" y="392" width="34" height="12" rx="3"/>
      <rect x="274" y="392" width="34" height="12" rx="3"/>
      <rect x="316" y="392" width="34" height="12" rx="3"/>
      <rect x="358" y="392" width="34" height="12" rx="3"/>
      <rect x="400" y="392" width="34" height="12" rx="3"/>
      <rect x="442" y="392" width="34" height="12" rx="3"/>
      <rect x="484" y="392" width="34" height="12" rx="3"/>

      <rect x="205" y="412" width="42" height="12" rx="3"/>
      <rect x="255" y="412" width="34" height="12" rx="3"/>
      <rect x="297" y="412" width="34" height="12" rx="3"/>
      <rect x="339" y="412" width="34" height="12" rx="3"/>
      <rect x="381" y="412" width="34" height="12" rx="3"/>
      <rect x="423" y="412" width="34" height="12" rx="3"/>
      <rect x="465" y="412" width="42" height="12" rx="3"/>

    </g>


    <!-- Trackpad -->
    <rect
      x="320"
      y="438"
      width="135"
      height="22"
      rx="6"
      fill="#4c1d95"
      stroke="#a855f7"
      stroke-width="1"
    />

  </g>


  <!-- Purple Mouse -->

  <g filter="url(#shadow)">

    <ellipse
      cx="730"
      cy="420"
      rx="65"
      ry="82"
      fill="#3b0764"
      stroke="#a855f7"
      stroke-width="3"
      transform="rotate(18 730 420)"
    />

    <path
      d="M730 350 L730 405"
      stroke="#c084fc"
      stroke-width="3"
      stroke-linecap="round"
    />

    <rect
      x="722"
      y="382"
      width="16"
      height="28"
      rx="8"
      fill="#8b5cf6"
      filter="url(#glow)"
    />

  </g>


  <!-- Coffee Mug -->

  <g filter="url(#shadow)">

    <!-- Mug body -->
    <rect
      x="680"
      y="150"
      width="145"
      height="190"
      rx="28"
      fill="url(#mug)"
      stroke="#c084fc"
      stroke-width="3"
    />

    <!-- Coffee -->
    <ellipse
      cx="752"
      cy="168"
      rx="62"
      ry="18"
      fill="#1c0b2e"
      stroke="#e9d5ff"
      stroke-width="3"
    />

    <!-- Handle -->
    <path
      d="M825 200 C890 195 890 295 825 285"
      fill="none"
      stroke="#8b5cf6"
      stroke-width="25"
      stroke-linecap="round"
    />

    <!-- Steam -->
    <path
      d="M720 125 C700 95 745 85 720 50"
      fill="none"
      stroke="#d8b4fe"
      stroke-width="5"
      stroke-linecap="round"
      opacity=".65"
    />

    <path
      d="M760 125 C740 95 790 85 765 45"
      fill="none"
      stroke="#c084fc"
      stroke-width="5"
      stroke-linecap="round"
      opacity=".55"
    />

  </g>


  <!-- Soft purple glow under objects -->

  <ellipse
    cx="430"
    cy="500"
    rx="330"
    ry="22"
    fill="#7c3aed"
    opacity=".15"
    filter="url(#glow)"
  />

</svg>
